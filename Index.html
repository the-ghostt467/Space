<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌻</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: radial-gradient(ellipse at 50% 0%, #2a2014 0%, #1a1410 60%, #100c08 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #girassois-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.15;
      pointer-events: none;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .container {
      text-align: center;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* GIRASSOL GIRANDO */
    .sunflower {
      width: 90px;
      height: 90px;
      margin: 0 auto 28px;
      animation: spin-slow 12s linear infinite;
      filter: drop-shadow(0 0 10px rgba(245,215,110,0.5));
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .motion-text {
      font-family: 'Courier New', monospace;
      font-size: clamp(15px, 4vw, 22px);
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #bf80ff;
      text-shadow:
        0 0 8px rgba(191,128,255,0.9),
        0 0 20px rgba(191,128,255,0.5),
        0 0 40px rgba(191,128,255,0.2);
      min-height: 2.5em;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .cursor {
      display: inline-block;
      width: 11px;
      height: 1em;
      background: #bf80ff;
      margin-left: 2px;
      vertical-align: middle;
      animation: piscar 0.7s step-end infinite;
      box-shadow: 0 0 8px rgba(191,128,255,0.9);
    }

    @keyframes piscar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes pulso {
      0%, 100% {
        text-shadow: 0 0 8px rgba(191,128,255,0.9), 0 0 20px rgba(191,128,255,0.5), 0 0 40px rgba(191,128,255,0.2);
      }
      50% {
        text-shadow: 0 0 14px rgba(191,128,255,1), 0 0 32px rgba(191,128,255,0.8), 0 0 60px rgba(191,128,255,0.4);
      }
    }

    .motion-text.pulsando { animation: pulso 2s ease-in-out infinite; }

    .senha-area {
      opacity: 0;
      transition: opacity 0.8s ease;
      width: 100%;
      max-width: 280px;
    }
    .senha-area.visivel { opacity: 1; }

    .senha-label {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(191,128,255,0.4);
      margin-bottom: 16px;
    }

    .senha-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(191,128,255,0.5);
      color: #bf80ff;
      font-family: 'Courier New', monospace;
      font-size: 20px;
      letter-spacing: 6px;
      text-align: center;
      width: 100%;
      padding: 8px 0;
      outline: none;
      caret-color: #bf80ff;
      text-shadow: 0 0 6px rgba(191,128,255,0.6);
    }

    .senha-input::placeholder {
      color: rgba(191,128,255,0.2);
      letter-spacing: 4px;
    }

    .btn-entrar {
      display: block;
      margin: 28px auto 0;
      background: transparent;
      border: 1px solid rgba(191,128,255,0.35);
      color: #bf80ff;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 12px 32px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 6px rgba(191,128,255,0.4);
      box-shadow: 0 0 5px rgba(191,128,255,0.2), 0 0 20px rgba(155,77,255,0.1);
    }

    .btn-entrar:hover {
      background: rgba(191,128,255,0.08);
      border-color: #bf80ff;
      box-shadow: 0 0 8px rgba(191,128,255,0.5), 0 0 30px rgba(155,77,255,0.3), 0 0 60px rgba(102,0,204,0.2);
    }

    .erro {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: #ff5e3a;
      text-shadow: 0 0 6px rgba(255,94,58,0.5);
      margin-top: 14px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .erro.visivel { opacity: 1; }

    .corner {
      position: fixed;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: rgba(191,128,255,0.12);
      letter-spacing: 2px;
    }
    .corner.tl { top: 16px; left: 16px; }
    .corner.tr { top: 16px; right: 16px; }
    .corner.bl { bottom: 16px; left: 16px; }
    .corner.br { bottom: 16px; right: 16px; }
  </style>
</head>

    <div class="motion-text" id="motion-text"><span class="cursor"></span></div>

    <div class="senha-area" id="senha-area">
      <p class="senha-label">acesso restrito</p>
      <input class="senha-input" id="senha-input" type="password" placeholder="· · · · ·" autocomplete="off"/>
      <button class="btn-entrar" id="btn-entrar">entrar</button>

    </div>
  </div>

  <script>
    var texto = "FOI FEITO ESPECIALMENTE PARA VOCÊ";
    var idx = 0;
    var motionEl = document.getElementById('motion-text');
    var senhaArea = document.getElementById('senha-area');
    var senhaInput = document.getElementById('senha-input');
    var btnEntrar = document.getElementById('btn-entrar');
    var erroEl = document.getElementById('erro');

    function digitar(){
      if(idx <= texto.length){
        motionEl.innerHTML = texto.slice(0, idx) + '<span class="cursor"></span>';
        idx++;
        setTimeout(digitar, idx > texto.length ? 0 : Math.random()*60+40);
      } else {
        motionEl.classList.add('pulsando');
        setTimeout(function(){ senhaArea.classList.add('visivel'); }, 600);
      }
    }
    setTimeout(digitar, 800);

    var SENHA = "estrela";
    function tentar(){
      if(senhaInput.value.toLowerCase() === SENHA){
        window.location.href = 'index.html';
      } else {
        erroEl.classList.add('visivel');
        senhaInput.value = '';
        setTimeout(function(){ erroEl.classList.remove('visivel'); }, 2000);
      }
    }
    btnEntrar.addEventListener('click', tentar);
    senhaInput.addEventListener('keydown', function(e){ if(e.key==='Enter') tentar(); });
  </script>
