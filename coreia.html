<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sua próxima aventura</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Raleway:wght@200;300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: radial-gradient(ellipse at 50% 0%, #0d1f4a 0%, #060f28 40%, #020818 100%);
      min-height: 100vh;
      font-family: 'Raleway', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    /* MAPA */
    .mapa-wrap {
      background: rgba(10,22,40,0.85);
      border: 1px solid rgba(240,192,96,0.2);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(240,192,96,0.06);
    }

    #mapa-svg { display: block; width: 100%; }

    /* PASSAPORTE */
    .passaporte {
      background: linear-gradient(145deg, #1a2a1a, #0f1f0f);
      border: 2px solid rgba(200,180,80,0.4);
      border-radius: 10px 10px 10px 10px;
      padding: 0;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 15px rgba(200,180,80,0.08);
      position: relative;
    }

    .passaporte-topo {
      background: linear-gradient(135deg, #1e3a1e, #152815);
      padding: 14px 18px 10px;
      border-bottom: 1px solid rgba(200,180,80,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .passaporte-brasao {
      opacity: 0.7;
    }

    .passaporte-titulo {
      text-align: center;
      flex: 1;
    }

    .passaporte-titulo p {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(200,180,80,0.7);
    }

    .passaporte-titulo h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 16px;
      color: #c8b450;
      letter-spacing: 2px;
    }

    .passaporte-corpo {
      padding: 14px 18px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .passaporte-foto {
      width: 70px;
      height: 85px;
      background: linear-gradient(135deg, #0a1628, #1a3a6e);
      border: 1px solid rgba(200,180,80,0.3);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .passaporte-dados {
      flex: 1;
      text-align: left;
    }

    .passaporte-campo {
      margin-bottom: 8px;
    }

    .passaporte-campo label {
      font-family: 'Raleway', sans-serif;
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(200,180,80,0.5);
      display: block;
      margin-bottom: 2px;
    }

    .passaporte-campo span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      color: #e8e0c0;
      letter-spacing: 1px;
    }

    .passaporte-carimbos {
      padding: 10px 18px 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .carimbo {
      border: 2px solid rgba(200,80,80,0.5);
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotate(var(--rot, -8deg));
      opacity: 0.7;
    }

    .carimbo span {
      font-family: 'Raleway', sans-serif;
      font-size: 7px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(200,80,80,0.9);
      text-align: center;
      line-height: 1.3;
    }

    .carimbo.azul {
      border-color: rgba(80,120,200,0.5);
    }
    .carimbo.azul span { color: rgba(80,120,200,0.9); }

    .passaporte-mrz {
      background: rgba(0,0,0,0.3);
      padding: 8px 18px;
      border-top: 1px solid rgba(200,180,80,0.1);
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: rgba(200,180,80,0.3);
      letter-spacing: 2px;
      text-align: left;
      line-height: 1.6;
    }

    /* MENSAGEM */
    .linha {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #f0c060, transparent);
      margin: 0 auto 20px;
    }

    .mensagem {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 19px;
      line-height: 1.75;
      color: #c8d8f0;
      margin-bottom: 0;
    }

    .voltar {
      display: inline-block;
      margin-top: 24px;
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(200,216,240,0.3);
      text-decoration: none;
      border-bottom: 1px solid rgba(200,216,240,0.12);
      padding-bottom: 4px;
      transition: color 0.3s ease;
    }

    .voltar:hover { color: rgba(200,216,240,0.6); }

    @keyframes voarAviao {
      0%   { offset-distance: 0%; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0.5; }
    }

    #aviao-animado {
      offset-path: path('M 60 160 C 120 80 260 60 330 90');
      animation: voarAviao 5s ease-in-out infinite;
      transform-origin: center;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- MAPA -->
    <div class="mapa-wrap">
      <svg id="mapa-svg" viewBox="0 0 400 220">
        <!-- fundo oceano -->
        <rect width="400" height="220" fill="#0a1628" rx="8"/>

        <!-- continentes simplificados -->
        <!-- América do Sul -->

        <!-- Brasil destacado -->
        <path d="M 60 130 C 62 125 70 120 78 122 C 82 128 82 138 78 145 C 72 150 63 148 60 143 Z" fill="#2a5a9e" opacity="0.9"/>
        <circle cx="70" cy="135" r="4" fill="#f0c060" opacity="0.9"/>
        <text x="58" y="158" font-family="Raleway" font-size="7" fill="rgba(200,216,240,0.6)" letter-spacing="1">BRASIL</text>

        <!-- Europa/África simplificado -->
        <path d="M 170 60 C 168 70 165 85 166 100 C 167 115 170 125 168 135 C 166 145 162 155 163 165 C 164 175 168 180 170 185 L 185 185 C 187 175 188 165 186 155 C 184 145 182 135 183 120 C 184 105 186 90 184 75 C 182 65 178 58 174 57 Z" fill="#1a3a6e" opacity="0.6"/>

        <!-- Ásia simplificada -->
        <path d="M 220 50 C 230 45 260 42 290 48 C 315 54 335 65 340 80 C 345 95 338 110 325 118 C 310 126 290 128 270 125 C 250 122 232 115 222 105 C 212 95 210 75 220 60 Z" fill="#1a3a6e" opacity="0.7"/>
        <!-- Coreia destacada -->
        <path d="M 318 78 C 321 75 328 74 332 77 C 335 80 334 86 331 89 C 327 92 320 91 317 88 C 314 84 315 80 318 78 Z" fill="#2a5a9e" opacity="0.95"/>
        <circle cx="325" cy="83" r="4" fill="#ff5e3a" opacity="0.9"/>
        <text x="310" y="100" font-family="Raleway" font-size="7" fill="rgba(200,216,240,0.6)" letter-spacing="1">COREIA</text>

        <!-- LINHA DA ROTA tracejada -->
        <path d="M 70 135 C 120 80 260 60 325 83" fill="none" stroke="rgba(240,192,96,0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>

        <!-- AVIÃO ANIMADO -->
        <g id="aviao-animado">
          <polygon points="0,-6 12,0 0,6" fill="#f0c060" opacity="0.95"/>
          <polygon points="0,-3 -8,-8 -8,-4" fill="#f0c060" opacity="0.7"/>
          <polygon points="0,3 -8,8 -8,4" fill="#f0c060" opacity="0.7"/>
        </g>

        <!-- labels -->
        <text x="200" y="215" font-family="Raleway" font-size="8" fill="rgba(200,216,240,0.2)" text-anchor="middle" letter-spacing="2">SUA PRÓXIMA AVENTURA,
        PARABÉNS MULHER!!!</text>
      </svg>
    </div>

    <!-- PASSAPORTE -->
    <div class="passaporte">
      <div class="passaporte-topo">
        <svg class="passaporte-brasao" width="30" height="30" viewBox="0 0 30 30">
          <circle cx="15" cy="15" r="13" fill="none" stroke="rgba(200,180,80,0.6)" stroke-width="1.5"/>
          <polygon points="15,5 17,11 23,11 18,15 20,21 15,17 10,21 12,15 7,11 13,11" fill="rgba(200,180,80,0.5)"/>
        </svg>
        <div class="passaporte-titulo">
          <p>república federativa do</p>
          <h3>PASSAPORTE</h3>
          <p>passport · passeport</p>
        </div>
        <svg class="passaporte-brasao" width="30" height="30" viewBox="0 0 30 30">
          <circle cx="15" cy="15" r="13" fill="none" stroke="rgba(200,180,80,0.6)" stroke-width="1.5"/>
          <polygon points="15,5 17,11 23,11 18,15 20,21 15,17 10,21 12,15 7,11 13,11" fill="rgba(200,180,80,0.5)"/>
        </svg>
      </div>

      <div class="passaporte-corpo">
        <div class="passaporte-foto">
          <svg width="40" height="50" viewBox="0 0 40 50">
            <circle cx="20" cy="16" r="11" fill="rgba(200,216,240,0.15)" stroke="rgba(200,216,240,0.2)" stroke-width="1"/>
            <path d="M 4 50 C 4 36 36 36 36 50" fill="rgba(200,216,240,0.1)" stroke="rgba(200,216,240,0.2)" stroke-width="1"/>
          </svg>
        </div>
        <div class="passaporte-dados">
          <div class="passaporte-campo">
            <label>nome / name</label>
            <span>Lulu Lua</span>
          </div>
          <div class="passaporte-campo">
            <label>nacionalidade</label>
            <span>Brasileira</span>
          </div>
          <div class="passaporte-campo">
            <label>destino / destination</label>
            <span>Coreia ✈</span>
          </div>
          <div class="passaporte-campo">
            <label>acompanhante</label>
            <span>Kiara (KIKA) 🤍</span>
          </div>
        </div>
      </div>

      <div class="passaporte-carimbos">
        <div class="carimbo" style="--rot:-10deg;">
          <span>Seoul<br>KR<br>✈</span>
        </div>
        <div class="carimbo azul" style="--rot:6deg;">
          <span>Incheon<br>ICN<br>2025</span>
        </div>
        <div class="carimbo" style="--rot:-4deg;">
          <span>Busan<br>PORT<br>✦</span>
        </div>
        <div class="carimbo azul" style="--rot:12deg;">
          <span>GRU<br>Brasil<br>✈</span>
        </div>
      </div>

      <div class="passaporte-mrz">
        P&lt;BRA LUA&lt;&lt;LULU&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;<br>
        A12345678&lt;BRA&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;
      </div>
    </div>

    <!-- MENSAGEM -->
    <div class="linha"></div>
    <p class="mensagem">
      Sua Viagem! Teve uma estrela!  
    </p>

    <a href="ceu.html" class="voltar">voltar ao céu</a>
  </div>
</body>
</html>
