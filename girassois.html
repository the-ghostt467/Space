<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Girassóis</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Raleway:wght@200;300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --terra-escuro: #1a1410;
      --dourado: #e8a52a;
      --creme: #e0d4c0;
    }

    body {
      background: radial-gradient(ellipse at 50% 0%, #2a2014 0%, #1a1410 60%, #100c08 100%);
      min-height: 100vh;
      font-family: 'Raleway', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .painel {
      background: rgba(140, 106, 47, 0.08);
      border: 1px solid rgba(232, 165, 42, 0.2);
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 0 30px rgba(232, 165, 42, 0.06), inset 0 0 50px rgba(16, 12, 8, 0.5);
    }

    .frase {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 19px;
      line-height: 1.6;
      color: var(--dourado);
      margin: 0 0 16px;
    }

    .assinatura {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(232, 165, 42, 0.5);
      margin: 0 0 28px;
    }

    .linha {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--dourado), transparent);
      margin: 0 auto 24px;
    }

    .texto {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 20px;
      line-height: 1.75;
      color: var(--creme);
      margin: 0;
    }

    .voltar {
      display: inline-block;
      margin-top: 32px;
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(232, 165, 42, 0.4);
      text-decoration: none;
      border-bottom: 1px solid rgba(232, 165, 42, 0.15);
      padding-bottom: 4px;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .voltar:hover {
      color: var(--dourado);
      border-color: rgba(232, 165, 42, 0.4);
    }
  </style>
</head>
<body>

    <div class="painel">

      <p class="frase">"O girassol é meu, de certa forma."</p>

      <div class="linha"></div>
      <p class="texto">Porque sei que ele é o seu pintor favorito, e sei o quanto você ama girassóis — deixei um pouco dele, e um pouco de você, aqui nessa estrela.</p>

</html>
